spring:
  application:
    name: auth-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: ${DB_PASSWORD:Haibabon@234}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/master.xml
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8081

# ===== OAUTH2 GOOGLE =====
google:
  oauth:
    client-id:
    client-secret:
    redirect-uri:
    user-info-uri:

# ===== JWT =====
jwt:
  expiration: 3600000
  refresh-expiration: 2592000000
  private-key: classpath:keys/private.pem
  public-key: classpath:keys/public.pem

# ===== EUREKA =====
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

kafka:
  command:
    user:
      create: create-user-command-topic
  notification:
    send-otp-email: send-otp-email-topic
    send-confirmation-registration-email: send-confirmation-registration-email-topic

# ===== LOGGING =====
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE

# ===== INTERNAL SERVICE SECRET =====
internal:
  secret: ${INTERNAL_SECRET:change-me-in-prod}

# ===== AUTH TOKEN (REDIS) =====
auth:
  token:
    refresh:
      redis-prefix: "auth:refresh:${spring.application.name}:"
      ttl-days: 7
  device:
    max-per-account: 3


