server:
  port: 8080

spring:
  application:
    name: api-gateway

  main:
    web-application-type: reactive

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  cloud:
    config:
      enabled: false   # Tắt Config Server

    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true

      routes:
        # ===== AUTH SERVICE =====
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # ===== USER SERVICE =====
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        # ===== NOTIFICATION SERVICE =====
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        # ===== TEST (auth-service) =====
        - id: test-permission
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/test/**

# ===== JWT (for token verification in gateway) =====
jwt:
  public-key: classpath:keys/public.pem

# ===== INTERNAL SERVICE SECRET =====
internal:
  secret: ${INTERNAL_SECRET:change-me-in-prod}

# ===== EUREKA =====
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# ===== LOGGING (DEBUG SECURITY + GATEWAY) =====
logging:
  level:
    # --- Spring Security (WebFlux) ---
    org.springframework.security: DEBUG
    org.springframework.security.web.server: DEBUG
    org.springframework.security.web.server.authorization: TRACE

    # --- Spring Cloud Gateway ---
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: TRACE
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE

    # --- WebFlux ---
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: TRACE

    # --- Reactor Netty HTTP ---
    reactor.netty.http.server: DEBUG
