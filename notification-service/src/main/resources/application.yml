spring:
  application:
    name: notification-service

  docker:
    compose:
      enabled: false

  # ===== MAIL =====
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:anvuduc150702@gmail.com}
    password: ${MAIL_PASSWORD:glfw ukui gxzh syju}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ===== KAFKA =====
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest

  # ===== JPA (disabled - notification service has no DB tables yet) =====
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration

server:
  port: 8083

# ===== EUREKA =====
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

kafka:
  notification:
    send-otp-email-topic: send-otp-email-topic
    send-confirmation-registration-email: send-confirmation-registration-email-topic
